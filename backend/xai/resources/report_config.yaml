# Configuration of the reports (K5, K6)
#
# Trial of phase 3 (14 November): Gemma 4 (gemma-4-26b-a4b-it, gemma-4-31b-it) answers
# 500 or 504 on the Gemini API; gemini-3.5-flash-lite answers, the same text with the same seed.
llm:
  provider: gemini
  model: gemini-3.5-flash-lite
  temperature: 0.0
  seed: 42
  timeout_s: 60
  max_tokens: 8192
max_attempts: 3
time_format: "m:ss"
