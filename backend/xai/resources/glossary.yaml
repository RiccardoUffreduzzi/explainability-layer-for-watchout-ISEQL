# Glossary of the terms
#
# This file holds only what WatchOut does not have: the report phrases and the formulas.
# Definitions that WatchOut has are read from its database, not copied here.
#
# - predicates: only the report phrase; the definition is read from the text given to the VLM.
# - audio_classes: only the report phrase; the definition is read from the keywords of
#   AppConfig.audio_taxonomy, with which WatchOut maps the audio model's answer to a class.
# - operators: definition of WatchOut's SQL (iseql/helpers.py) with rho = 0,
#   report phrase and readings of the parameters. {r} and {s} are the two operands,
#   {unit} is the parameter's compare_domain.
# - events: only the report phrase; the definition is the rule saved in EventSpec.
# - comparisons: conditions between variables (identity, attribute_comparison and
#   duration nodes), named <node kind>_<operator>: eq (=), ne (≠), lt (<), le (<=),
#   gt (>), ge (>=); xai.contract.ids.comparison_term gives the name of a node.
#   Definition as a formula. {left} and {right} are the two sides; a duration has
#   {x} (what lasts), {value} and {unit}.
#
# Placeholders {arg1}, {arg2} are the arguments of a predicate in signature order.
version: 0.2.0

predicates:
  running:
    plain_template: "{arg1} runs"
  enter_or_exit_vehicle:
    plain_template: "{arg1} gets into or out of the driver's seat of {arg2}"
  carrying:
    plain_template: "{arg1} carries {arg2}"
  physical_altercation:
    plain_template: "{arg1} and {arg2} fight"
  vehicle_collision:
    plain_template: "{arg1} shows collision damage"
  gunshot_visible:
    plain_template: "{arg1} holds or fires a gun"
  explosion_visible:
    plain_template: "an explosion is visible at {arg1}"
  suspicious_near_vehicle:
    plain_template: "{arg1} lingers suspiciously around {arg2}"

audio_classes:
  shout:
    plain_template: a shout is heard
  impact:
    plain_template: an impact is heard
  gunshot_or_explosion:
    plain_template: a gunshot or an explosion is heard
  engine:
    plain_template: an engine is heard
  tire_squeal:
    plain_template: tyres squealing are heard
  glass_breaking:
    plain_template: glass breaking is heard
  horn:
    plain_template: a horn is heard
  skidding:
    plain_template: tyres skidding are heard

operators:
  Bef:
    definition: "r.Te ζ s.Ts, s.Ts − r.Te ≤ δ"
    plain_template: "{r} ends before {s} starts"
    parameter_readings:
      - {condition: "δ = ∞", phrase: "at any time after"}
      - {condition: "δ = d", phrase: "within d {unit}"}
  Aft:
    definition: "s.Te ζ r.Ts, r.Ts − s.Te ≤ δ"
    plain_template: "{r} starts after {s} ends"
    parameter_readings:
      - {condition: "δ = ∞", phrase: "at any time after"}
      - {condition: "δ = d", phrase: "within d {unit}"}
  SP:
    definition: "r.Ts ζ s.Ts < r.Te, s.Ts − r.Ts ≤ δ"
    plain_template: "{s} starts while {r} is ongoing"
    parameter_readings:
      - {condition: "δ = ∞", phrase: "at any time while {r} is ongoing"}
      - {condition: "δ = d", phrase: "within d {unit} of the start of {r}"}
  EF:
    definition: "r.Ts < s.Te η r.Te, r.Te − s.Te ≤ ε"
    plain_template: "{s} ends while {r} is ongoing"
    parameter_readings:
      - {condition: "ε = ∞", phrase: "at any time before {r} ends"}
      - {condition: "ε = d", phrase: "within d {unit} before {r} ends"}
  DJ:
    definition: "s.Ts ζ r.Ts ≤ s.Te, s.Ts ≤ r.Te η s.Te, r.Ts − s.Ts ≤ δ, s.Te − r.Te ≤ ε"
    plain_template: "{r} happens during {s}"
    parameter_readings:
      - {condition: "δ = ∞", phrase: "starting at any time after {s} starts"}
      - {condition: "δ = d", phrase: "starting within d {unit} of the start of {s}"}
      - {condition: "ε = ∞", phrase: "ending at any time before {s} ends"}
      - {condition: "ε = d", phrase: "ending within d {unit} of the end of {s}"}
  RDJ:
    definition: "r.Ts ζ s.Ts ≤ r.Te, r.Ts ≤ s.Te η r.Te, s.Ts − r.Ts ≤ δ, r.Te − s.Te ≤ ε"
    plain_template: "{s} happens during {r}"
    parameter_readings:
      - {condition: "δ = ∞", phrase: "starting at any time after {r} starts"}
      - {condition: "δ = d", phrase: "starting within d {unit} of the start of {r}"}
      - {condition: "ε = ∞", phrase: "ending at any time before {r} ends"}
      - {condition: "ε = d", phrase: "ending within d {unit} of the end of {r}"}
  LOJ:
    definition: "r.Ts ζ s.Ts < r.Te η s.Te, s.Ts − r.Ts ≤ δ, s.Te − r.Te ≤ ε"
    plain_template: "{r} starts first and {s} starts before {r} ends"
    parameter_readings:
      - {condition: "δ = ∞", phrase: "{s} starting at any time after {r} starts"}
      - {condition: "δ = d", phrase: "{s} starting within d {unit} of the start of {r}"}
      - {condition: "ε = ∞", phrase: "{s} ending at any time after {r} ends"}
      - {condition: "ε = d", phrase: "{s} ending within d {unit} of the end of {r}"}
  ROJ:
    definition: "s.Ts ζ r.Ts < s.Te η r.Te, r.Ts − s.Ts ≤ δ, r.Te − s.Te ≤ ε"
    plain_template: "{s} starts first and {r} starts before {s} ends"
    parameter_readings:
      - {condition: "δ = ∞", phrase: "{r} starting at any time after {s} starts"}
      - {condition: "δ = d", phrase: "{r} starting within d {unit} of the start of {s}"}
      - {condition: "ε = ∞", phrase: "{r} ending at any time after {s} ends"}
      - {condition: "ε = d", phrase: "{r} ending within d {unit} of the end of {s}"}

events:
  fight:
    plain_template: a fight
  gunshot_or_explosion:
    plain_template: a gunshot or an explosion
  handoff:
    plain_template: an object passes from one person to another
  suspicious_near_vehicle:
    plain_template: a person lingering suspiciously near a vehicle
  vehicle_collision:
    plain_template: a vehicle collision
  vehicle_escape:
    plain_template: a vehicle escape

comparisons:
  identity_eq:
    definition: "left = right"
    plain_template: "{left} and {right} are the same"
  identity_ne:
    definition: "left ≠ right"
    plain_template: "{left} and {right} are different"
  attribute_comparison_eq:
    definition: "left = right"
    plain_template: "{left} is equal to {right}"
  attribute_comparison_ne:
    definition: "left ≠ right"
    plain_template: "{left} is different from {right}"
  attribute_comparison_lt:
    definition: "left < right"
    plain_template: "{left} is less than {right}"
  attribute_comparison_le:
    definition: "left ≤ right"
    plain_template: "{left} is at most {right}"
  attribute_comparison_gt:
    definition: "left > right"
    plain_template: "{left} is greater than {right}"
  attribute_comparison_ge:
    definition: "left ≥ right"
    plain_template: "{left} is at least {right}"
  duration_eq:
    definition: "(end − start) = value"
    plain_template: "{x} lasts exactly {value} {unit}"
  duration_lt:
    definition: "(end − start) < value"
    plain_template: "{x} lasts less than {value} {unit}"
  duration_le:
    definition: "(end − start) ≤ value"
    plain_template: "{x} lasts at most {value} {unit}"
  duration_gt:
    definition: "(end − start) > value"
    plain_template: "{x} lasts more than {value} {unit}"
  duration_ge:
    definition: "(end − start) ≥ value"
    plain_template: "{x} lasts at least {value} {unit}"
