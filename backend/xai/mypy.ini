[mypy]
# Run from backend: `mypy --config-file xai/mypy.ini xai`.
python_version = 3.10
strict = True
plugins = pydantic.mypy
mypy_path = src
explicit_package_bases = True
exclude = (^|/)output/
cache_dir = xai/.mypy_cache

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True

[mypy-xai.adapters.watchout.*,xai.tests.*]
# WatchOut's functions have no type annotations (the conformance tests call them too).
disallow_untyped_calls = False

[mypy-yaml.*]
# PyYAML is a WatchOut dependency; its type stubs (types-PyYAML) are not installed.
ignore_missing_imports = True

[mypy-jsonschema.*]
# Test-only; already installed with WatchOut's dependencies, without type stubs.
ignore_missing_imports = True

[mypy-api.*,service.*,iseql.*,utils.*,models.*]
# WatchOut's own code: xai.adapters.watchout imports it, xai does not type-check it.
follow_imports = silent
