app:
  name: WATCHOUT ISEQL
  version: 0.1.0
  debug: true

server:
  host: 0.0.0.0
  port: 8000
  cors_origins: http://localhost:5173,http://127.0.0.1:5173
  servlet:
    context_path: /api

data:
  dir: ../data
  db_path: ../data/analysis.db
  upload_dir: ../data/uploads

vlm:
  ollama_base_url: http://localhost:11434
  timeout: 60

gpu:
  devices: auto
  max_memory_fraction: 0.9
  vram_safety_factor: 1.3

log:
  path: tmp/log

post_analysis:
  # Started when an analysis reaches 'done'
  # {python} is the backend's interpreter, {analysis_id} the analysis. Empty list = disabled.
  command: ["{python}", "-m", "xai.cli.pipeline", "run", "--analysis", "{analysis_id}"]
