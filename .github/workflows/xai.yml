# Quality gate of the code in backend/xai: ruff, mypy --strict, schema, pytest.
# Separate from WatchOut's ci.yml, which stays unchanged.
name: xai

on:
  push:
    paths:
      - "backend/xai/**"
      - "backend/src/**"
      - "backend/Pipfile*"
      - ".github/workflows/xai.yml"
  pull_request:
    paths:
      - "backend/xai/**"
      - "backend/src/**"
      - "backend/Pipfile*"
      - ".github/workflows/xai.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Same versions as Pipfile.lock. backend/xai calls WatchOut's own code (compiler,
      # detection, registry, GUI defaults), which imports pandas, numpy, pyyaml, munch,
      # fastapi and pillow; the ML stack is not needed.
      - name: Install the packages backend/xai uses
        run: >-
          python -m pip install
          "pydantic==2.12.5" "jsonschema==4.26.0"
          "pandas==2.3.3" "numpy==1.26.4" "pyyaml==6.0.3" "munch==4.0.0"
          "fastapi==0.128.0" "pillow==12.2.0"
          "pytest==9.1.1" "ruff==0.16.5" "mypy==2.4.0"
      - name: Lint (ruff)
        run: ruff check xai
      - name: Format (ruff)
        run: ruff format --check xai
      - name: Types (mypy --strict)
        run: mypy --config-file xai/mypy.ini xai
      - name: JSON schema matches the model
        run: python -m xai.contract.json_schema --check
      - name: Tests (pytest)
        working-directory: backend/xai
        run: python -m pytest
