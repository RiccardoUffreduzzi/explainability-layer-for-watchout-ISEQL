name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # The ISEQL engine tests are dependency-light (no torch/VLM/audio); only
      # pytest + pytest-cov are required, plus munch for the post-analysis hook
      # tests (same version as Pipfile.lock). `pytest.ini` sets `pythonpath = src`.
      - name: Install test dependencies
        run: pip install pytest pytest-cov "munch==4.0.0"

      - name: Run backend tests with coverage
        run: pytest --cov=iseql --cov=service.relation_vocab --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error

  frontend:
    name: Frontend tests + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (svelte-check)
        run: pnpm run check

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm run build

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error

  coverage-badge:
    name: Update coverage badge
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-coverage'
          path: cov-artifacts
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate coverage badge
        run: |
          BXML=$(find cov-artifacts -name coverage.xml | head -1)
          FLCOV=$(find cov-artifacts -name lcov.info | head -1)
          python3 scripts/coverage_badge.py "$BXML" "$FLCOV"

      - name: Commit coverage badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coverage/coverage.json
          git commit -m "chore: update coverage badge [skip ci]" || echo "No changes to commit"
          git push
